name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Use the offline canned backend so CI doesn't need a real API key.
      # The real key is never exposed to GitHub Actions.
      JEVLANG_FAKE_JEV: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Smoke test imports
        run: |
          uv run python -c "import jevlang; import triage; print('imports OK')"

      - name: Run test script
        run: uv run python test_router.py